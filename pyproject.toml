[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prnarrator"
version = "1.0.0"
description = "AI-assisted GitHub pull request analysis and review using FastAPI, LangGraph, and Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "httpx",
    "python-dotenv",
    "pydantic-settings",
    "langgraph",
    "langchain-core",
    "langchain-ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]